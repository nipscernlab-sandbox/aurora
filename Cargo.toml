[workspace]
resolver = "3"
members = ["crates/aurora-core", "crates/aurora-learn", "crates/aurora-cli", "crates/aurora-installer", "crates/aurora-protocol", "crates/aurora-agent", "crates/aurora-git"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
aurora-core = { path = "crates/aurora-core" }
aurora-learn = { path = "crates/aurora-learn" }
aurora-installer = { path = "crates/aurora-installer" }
aurora-protocol = { path = "crates/aurora-protocol" }
aurora-agent = { path = "crates/aurora-agent" }
aurora-git = { path = "crates/aurora-git" }
camino = { version = "1", features = ["serde1"] }
dunce = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
anstream = "1"
anstyle = "1"
clap_complete = "4"
insta = { version = "1", features = ["json", "redactions"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
zstd = { version = "0.14", features = ["zstdmt"] }
tar = "0.4"
# Os quadros da placa virtual em PNG, e em base64 no protocolo.
png = "0.18"
base64 = "0.22"
flate2 = "1"
schemars = "1"
jsonschema = { version = "0.58", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "process", "system"] }
signal-hook = { version = "0.3", default-features = false }
win32job = "2"
fst-reader = "0.17"
roxmltree = "0.21"
trash = "5.2.9"
