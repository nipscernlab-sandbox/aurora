[package]
name = "aurora-cli"
description = "Linha de comando da AURORA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
aurora-core.workspace = true
aurora-installer.workspace = true
aurora-learn.workspace = true
aurora-protocol.workspace = true
# O assistente do aurora chat: uma sessão do Claude Code com o aurora mcp.
aurora-agent.workspace = true
# O controle de versão: os métodos `git.*` e `github.*` do aurora serve.
aurora-git.workspace = true
anyhow.workspace = true
anstream.workspace = true
anstyle.workspace = true
clap_complete.workspace = true
camino.workspace = true
clap.workspace = true
dunce.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
tar.workspace = true
flate2.workspace = true
# A tela do modo watch do `aurora learn` (learn_tui.rs), como a TUI do
# instalador; `line_count` limita a rolagem do enunciado.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `aurora proc remove --delete` manda a pasta do processador para a lixeira do
# sistema, como o Studio: nada de código do usuário se perde de vez.
trash.workspace = true

[dev-dependencies]
jsonschema.workspace = true
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
